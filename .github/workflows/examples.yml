name: Classroom examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, run and test every standalone Java example
        run: python tools/check_examples.py
      - name: Windows launchers, arguments and error codes
        if: runner.os == 'Windows'
        run: python tools/check_windows_launchers.py

  optional-windows-languages:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run and test C++ in the Visual C++ developer environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where cl || exit /b 1
          call Topic02\Demo07StacksAcrossLanguages\cpp\run.cmd
          if errorlevel 1 exit /b 1
          call Topic02\Demo07StacksAcrossLanguages\cpp\run.cmd test
          if errorlevel 1 exit /b 1
      - name: Run and test the optional stack implementations
        shell: powershell
        run: |
          foreach ($language in @('csharp', 'python')) {
              & ".\Topic02\Demo07StacksAcrossLanguages\$language\run.cmd"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & ".\Topic02\Demo07StacksAcrossLanguages\$language\run.cmd" test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
